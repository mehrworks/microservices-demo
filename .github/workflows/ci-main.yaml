# Dormant scaffold note:
# This branch keeps the original multi-service repo shape as reference, but only
# `frontend` (catalog-only mode) and `productcatalogservice` are active in the
# CI/deploy loop for now.
# When you add or remove active services later, update this workflow together
# with skaffold.yaml, kubernetes-manifests/kustomization.yaml,
# kustomize/base/kustomization.yaml, and the service-specific waits/smoke checks
# below. Prefer commenting services in or out together rather than deleting the
# surrounding workflow history.

name: "Continuous Integration - Main/Release"
on:
  push:
    # run on pushes to main or release/*
    branches:
      - main
      - release/*
    paths:
      - 'src/frontend/**'
      - 'src/productcatalogservice/**'
      - 'skaffold.yaml'
      - 'kubernetes-manifests/**'
      - 'kustomize/base/**'
      - 'kustomize/kustomization.yaml'
      - 'release/kubernetes-manifests.yaml'
      - 'config/gke-exposure/**'
      - 'cloudbuild.yaml'
      - '.github/workflows/ci-main.yaml'
      - '.github/workflows/ci-pr.yaml'
jobs:
  code-tests:
    runs-on: [self-hosted, is-enabled]
    steps:
    - uses: actions/checkout@v6
    # Dormant scaffold mode: keep C# tooling visible in workflow history, but
    # cartservice is not in the active loop right now.
    # - uses: actions/setup-dotnet@v5
    #   env:
    #     DOTNET_INSTALL_DIR: "./.dotnet"
    #   with:
    #     dotnet-version: '10.0'
    - uses: actions/setup-go@v6
      with:
        go-version: '1.25'
    - name: Go Unit Tests
      timeout-minutes: 10
      run: |
        # Dormant scaffold mode: only frontend + productcatalogservice stay active.
        # Re-enable other services here in the same commit that reactivates them
        # in skaffold/manifests and deployment waits below.
        for SERVICE in "frontend" "productcatalogservice"; do
          echo "testing $SERVICE..."
          pushd src/$SERVICE
          go test ./...
          popd
        done
        # Previously active in this workflow:
        # - shippingservice
    # Dormant scaffold mode: cartservice unit tests are preserved here as
    # commented history until cartservice returns to the active loop.
    # - name: C# Unit Tests
    #   timeout-minutes: 10
    #   run: |
    #     dotnet test src/cartservice/
  deployment-tests:
    runs-on: [self-hosted, is-enabled]
    needs: code-tests
    strategy:
      matrix:
        profile: ["local-code"]
      fail-fast: true
    steps:
    - uses: actions/checkout@v6
    - name: Build + Deploy PR images to GKE
      timeout-minutes: 20
      run: |
        PR_NUMBER=$(echo $GITHUB_REF | awk 'BEGIN { FS = "/" } ; { print $3 }')
        NAMESPACE="pr${PR_NUMBER}"
        echo "::set-env name=NAMESPACE::$NAMESPACE"
        echo "::set-env name=PR_NUMBER::$PR_NUMBER"

        yes | gcloud auth configure-docker us-docker.pkg.dev
        gcloud container clusters get-credentials $PR_CLUSTER --region $REGION --project $PROJECT_ID
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: Namespace
        metadata:
          name: $NAMESPACE
        EOF
        echo Deploying application
        skaffold config set --global local-cluster false
        # Dormant scaffold mode: skip the full-app network-policies profile and
        # deploy the thin public edge + productcatalogservice only.
        skaffold run --default-repo=us-docker.pkg.dev/$PROJECT_ID/$GITHUB_REF --tag=$GITHUB_SHA --namespace=$NAMESPACE
      env:
        ACTIONS_ALLOW_UNSECURE_COMMANDS: true
        PROJECT_ID: "online-boutique-ci"
        PR_CLUSTER: "prs-gke-cluster"
        REGION: "us-central1"
    - name: Wait For Pods
      timeout-minutes: 20
      run: |
        set -x
        kubectl config set-context --current --namespace=$NAMESPACE
        # Dormant scaffold mode: only frontend + productcatalogservice are expected here.
        kubectl wait --for=condition=available --timeout=1000s deployment/frontend
        kubectl wait --for=condition=available --timeout=1000s deployment/productcatalogservice
        # Previously active waits retained as commented history:
        # kubectl wait --for=condition=available --timeout=1000s deployment/redis-cart
        # kubectl wait --for=condition=available --timeout=1000s deployment/adservice
        # kubectl wait --for=condition=available --timeout=1000s deployment/cartservice
        # kubectl wait --for=condition=available --timeout=1000s deployment/checkoutservice
        # kubectl wait --for=condition=available --timeout=1000s deployment/currencyservice
        # kubectl wait --for=condition=available --timeout=1000s deployment/emailservice
        # kubectl wait --for=condition=available --timeout=1000s deployment/frontend
        # kubectl wait --for=condition=available --timeout=1000s deployment/loadgenerator
        # kubectl wait --for=condition=available --timeout=1000s deployment/paymentservice
        # kubectl wait --for=condition=available --timeout=1000s deployment/recommendationservice
        # kubectl wait --for=condition=available --timeout=1000s deployment/shippingservice
    - name: Smoke Test Catalog Frontend
      timeout-minutes: 10
      run: |
        set -euxo pipefail
        kubectl config set-context --current --namespace=$NAMESPACE
        kubectl port-forward service/frontend 18080:80 >/tmp/frontend-port-forward.log 2>&1 &
        PORT_FORWARD_PID=$!
        cleanup() {
          kill "$PORT_FORWARD_PID" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        for _ in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:18080/_healthz >/dev/null; then
            break
          fi
          sleep 2
        done

        curl -fsS http://127.0.0.1:18080/ >/tmp/frontend-home.html
        grep -q "Catalog-only mode is active" /tmp/frontend-home.html
        grep -q "Hot Products" /tmp/frontend-home.html
