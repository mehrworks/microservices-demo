# ----------------------------------------------------------
# Dormant scaffold note:
# On this branch, the original multi-service release path is narrowed so the
# upstream-style command below still works for the active service only:
#
#   kubectl apply -f ./release/kubernetes-manifests.yaml
#
# This file intentionally tracks the current productcatalogservice-only active
# surface. The broader full-app release knowledge remains preserved elsewhere in
# the repo as dormant scaffold/reference material.
# ----------------------------------------------------------

# [START gke_release_kubernetes_manifests_microservices_demo]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  labels:
    app: productcatalogservice
spec:
  selector:
    matchLabels:
      app: productcatalogservice
  template:
    metadata:
      labels:
        app: productcatalogservice
    spec:
      serviceAccountName: productcatalogservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: productcatalogservice
        ports:
        - containerPort: 3550
        env:
        # Dormant scaffold note:
        # This branch keeps vendor source close to upstream for now. Runtime
        # policy for the active service is controlled here in manifests rather
        # than by changing src/productcatalogservice semantics.
        - name: PORT
          value: "3550"
        # Active branch default: keep profiler off unless you deliberately
        # re-enable it in the manifest alongside other active-service changes.
        - name: DISABLE_PROFILER
          value: "1"
        # Tracing stays off by default because ENABLE_TRACING is intentionally
        # omitted here. Add it only when you want tracing back in the active loop.
        # AlloyDB also stays dormant unless its env surface is added explicitly.
        readinessProbe:
          grpc:
            port: 3550
        livenessProbe:
          grpc:
            port: 3550
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  labels:
    app: productcatalogservice
spec:
  type: ClusterIP
  selector:
    app: productcatalogservice
  ports:
  - name: grpc
    port: 3550
    targetPort: 3550
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: productcatalogservice
